<svg viewBox="0 0 800 1040" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5bb3ff"/>
      <stop offset="100%" stop-color="#0a4fd6"/>
    </linearGradient>
    <linearGradient id="blueGradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4da6ff"/>
      <stop offset="100%" stop-color="#0d3fb0"/>
    </linearGradient>
  </defs>

  <!-- ===================== HEXAGON FRAME ===================== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- left (white) half -->
    <path d="M400,60 L188,205 L188,470 L400,610" stroke="#f2f5f9" stroke-width="16"/>
    <!-- right (blue) half, with small zig-zag "3" accent -->
    <path d="M400,60 L612,205 L612,340 L560,380 L612,420 L612,470 L400,610" stroke="url(#blueGrad)" stroke-width="16"/>
  </g>

  <!-- ===================== PRINTER ICON ===================== -->
  <g>
    <!-- vertical rod above the head -->
    <rect x="392" y="110" width="16" height="90" rx="4" fill="#1c1f26"/>
    <!-- print head -->
    <rect x="355" y="195" width="90" height="80" rx="10" fill="#14161b" stroke="#2b2f38" stroke-width="3"/>
    <!-- X mark on head -->
    <g stroke-linecap="round">
      <line x1="375" y1="215" x2="405" y2="255" stroke="#f2f5f9" stroke-width="7"/>
      <line x1="405" y1="215" x2="380" y2="250" stroke="url(#blueGrad)" stroke-width="7"/>
    </g>
    <!-- horizontal rail -->
    <rect x="270" y="228" width="90" height="10" rx="4" fill="#1c1f26"/>
    <rect x="440" y="228" width="90" height="10" rx="4" fill="#1c1f26"/>
    <rect x="255" y="220" width="16" height="26" rx="4" fill="#22262f"/>
    <rect x="529" y="220" width="16" height="26" rx="4" fill="#22262f"/>
    <!-- nozzle -->
    <path d="M390,275 L410,275 L400,305 Z" fill="#0d0f13"/>

    <!-- printed "3D" letters, layered to suggest print lines -->
    <g font-family="Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
      <text x="400" y="470" font-size="90" fill="#0a4fd6" opacity="0.35">3D</text>
      <text x="400" y="462" font-size="90" fill="#1f6feb" opacity="0.55">3D</text>
      <text x="400" y="454" font-size="90" fill="url(#blueGradV)">3D</text>
    </g>

    <!-- print bed -->
    <rect x="300" y="560" width="200" height="18" rx="4" fill="#0d0f13" stroke="#2b2f38" stroke-width="2"/>
    <rect x="280" y="578" width="240" height="14" rx="3" fill="#08090b"/>
  </g>

  <!-- ===================== WORDMARK ===================== -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <text x="330" y="760" font-size="98" fill="#f2f5f9" letter-spacing="2">LAYER</text>
    <text x="590" y="760" font-size="130" fill="url(#blueGrad)">X</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <text x="400" y="825" font-size="56" fill="url(#blueGrad)" letter-spacing="6">3D</text>
  </g>
  <line x1="150" y1="808" x2="330" y2="808" stroke="url(#blueGrad)" stroke-width="3"/>
  <line x1="470" y1="808" x2="650" y2="808" stroke="url(#blueGrad)" stroke-width="3"/>

  <!-- ===================== TAGLINE ===================== -->
  <text x="400" y="868" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4"
        text-anchor="middle" fill="#e6eaf0">
    IMPRESSÃO 3D <tspan fill="url(#blueGrad)">•</tspan> CRIAÇÃO SEM LIMITES
  </text>

  <!-- ===================== ICON ROW ===================== -->
  <g fill="none" stroke="url(#blueGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">

    <!-- Decoração: isometric cube -->
    <g transform="translate(100,905)">
      <path d="M0,-22 L22,-11 L22,11 L0,22 L-22,11 L-22,-11 Z"/>
      <path d="M0,-22 L0,0 M0,0 L22,-11 M0,0 L-22,-11 M0,0 L0,22"/>
    </g>

    <!-- Chaveiros: keychain -->
    <g transform="translate(260,905)">
      <circle cx="0" cy="-18" r="9"/>
      <line x1="0" y1="-9" x2="0" y2="4"/>
      <circle cx="0" cy="16" r="16"/>
    </g>

    <!-- Peças: gear -->
    <g transform="translate(420,905)">
      <circle cx="0" cy="0" r="14"/>
      <circle cx="0" cy="0" r="5" fill="url(#blueGrad)" stroke="none"/>
      <g id="teeth">
        <rect x="-4" y="-26" width="8" height="10" rx="2"/>
      </g>
      <use href="#teeth" transform="rotate(45)"/>
      <use href="#teeth" transform="rotate(90)"/>
      <use href="#teeth" transform="rotate(135)"/>
      <use href="#teeth" transform="rotate(180)"/>
      <use href="#teeth" transform="rotate(225)"/>
      <use href="#teeth" transform="rotate(270)"/>
      <use href="#teeth" transform="rotate(315)"/>
    </g>

    <!-- Organização: cup with pens -->
    <g transform="translate(580,905)">
      <path d="M-16,-6 L16,-6 L12,20 L-12,20 Z"/>
      <line x1="-6" y1="-6" x2="-10" y2="-28"/>
      <line x1="2" y1="-6" x2="2" y2="-30"/>
      <line x1="8" y1="-6" x2="14" y2="-26"/>
    </g>

    <!-- Colecionáveis: mini figure -->
    <g transform="translate(740,905)">
      <circle cx="0" cy="-18" r="9"/>
      <rect x="-11" y="-8" width="22" height="20" rx="4"/>
      <line x1="-11" y1="-2" x2="-20" y2="8"/>
      <line x1="11" y1="-2" x2="20" y2="8"/>
      <line x1="-6" y1="12" x2="-8" y2="28"/>
      <line x1="6" y1="12" x2="8" y2="28"/>
    </g>
  </g>

  <!-- ICON LABELS -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.5"
     text-anchor="middle" fill="#dfe4ea">
    <text x="100" y="965">DECORAÇÃO</text>
    <text x="260" y="965">CHAVEIROS</text>
    <text x="420" y="965">PEÇAS</text>
    <text x="580" y="965">ORGANIZAÇÃO</text>
    <text x="740" y="965">COLECIONÁVEIS</text>
  </g>
</svg>
